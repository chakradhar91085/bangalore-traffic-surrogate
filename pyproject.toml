[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-surrogate"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "xgboost", "torch", "matplotlib", "seaborn", "streamlit", "plotly"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
